name: check

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
          node --check bin/web-entry.mjs
          node --check tools/embed-ja.mjs
      - name: Embedded Japanese dictionary is up to date
        run: node tools/embed-ja.mjs --check
