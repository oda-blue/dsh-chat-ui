name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the tag matches package.json
        # Refuse to release, e.g., a 0.1.0 tarball under a v0.2.0 tag
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version v$version"
            exit 1
          fi
      - name: Check the embedded Japanese dictionary is current
        run: node tools/embed-ja.mjs --check
      - name: Build the tarball
        run: npm pack
      - name: Attach the tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dsh-chat-ui-*.tgz --generate-notes --title "${{ github.ref_name }}"
